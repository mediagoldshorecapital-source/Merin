<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge — Prime Ingredients newsletter studio</title>
<meta name="description" content="Preview and preflight Prime Ingredients email newsletters before they go out.">
<link rel="stylesheet" href="assets/forge.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232E3D31'/><text x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23A9805A' text-anchor='middle'>F</text></svg>">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <a class="brand" href="./"><b>Forge</b> <span>Prime Ingredients</span></a>
    <nav>
      <a class="ghost" href="https://tryprimeingredients.com" target="_blank" rel="noopener">Storefront</a>
      <button class="ghost" id="theme" type="button">Theme</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <div class="eyebrow">Newsletter studio</div>
    <h1>Every email, previewed and preflighted.</h1>
    <p class="lede">
      Each newsletter in the repository is rendered here exactly as it will land in the inbox,
      with a size, link and accessibility check run against the source before you send.
    </p>
  </section>

  <section id="grid" class="grid" aria-busy="true"></section>
</main>

<footer class="site">
  <div class="wrap">
    <span>Forge — built from <code>newsletters/</code></span>
    <span id="built"></span>
  </div>
</footer>

<script src="assets/theme.js"></script>
<script src="assets/index.js"></script>
</body>
</html>
