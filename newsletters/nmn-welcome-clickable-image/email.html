<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>So glad you're here — NMN Welcome</title>
  <style>
    body { margin:0; padding:0; background-color:#EFE9E0; -webkit-text-size-adjust:100%; }
    img { border:0; line-height:100%; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; display:block; }
    table { border-collapse:collapse; }
    a { text-decoration:none; }
  </style>
</head>
<body>
  <!--
    NMN welcome newsletter as a single clickable hero image.
    The image is used EXACTLY as provided (hosted on CloudFront) and is not altered.
    Clickable hotspots (HTML image map), calibrated to a 600px display width:
      - "DISCOVER NMN ->"   button  -> https://tryprimeingredients.com/products/nmn
      - "START YOUR ROUTINE" button -> https://tryprimeingredients.com/products/nmn
    Note: image-map coordinates are fixed pixels and align best at the 600px width.
    Some email clients (Outlook desktop) ignore image maps, and mobile rescaling
    can shift hotspots. The footer links were intentionally left unlinked pending
    confirmation.
  -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EFE9E0;">
    <tr>
      <td align="center" style="padding:0;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;">
          <tr>
            <td align="center" style="padding:0;font-size:0;line-height:0;">
              <img
                src="https://d3k81ch9hvuctc.cloudfront.net/company/XTxzmw/images/2355ef42-ae0c-46f3-a2f4-055652f11596.png"
                width="600"
                height="2220"
                alt="So glad you're here. Meet NMN — cellular energy in a single capsule. Discover NMN and start your routine."
                usemap="#nmnmap"
                style="display:block;width:600px;max-width:600px;height:auto;">
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

  <map name="nmnmap">
    <!-- "DISCOVER NMN ->" button -->
    <area shape="rect" coords="150,945,450,1010"
          href="https://tryprimeingredients.com/products/nmn"
          alt="Discover NMN" title="Discover NMN" target="_blank">
    <!-- "START YOUR ROUTINE" button -->
    <area shape="rect" coords="165,2065,435,2135"
          href="https://tryprimeingredients.com/products/nmn"
          alt="Start your routine" title="Start your routine" target="_blank">
  </map>
</body>
</html>
